  <style>
    :root { color-scheme: dark; --ink:#f7fffc; --muted:#9bc4bc; --accent:#8ddbe0; --line:rgba(141,219,224,.2); }
    * { box-sizing:border-box; }
    html, body { width:100%; min-height:100%; max-width:100vw; }
    body {
      margin:0; display:flex; align-items:center; justify-content:center; overflow:hidden;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink); background:#090b0b;
    }
    body::before {
      content:""; position:fixed; inset:0; pointer-events:none;
      background:#050909;
    }
    .glow { position:fixed; width:30rem; height:30rem; border-radius:50%; filter:blur(100px); opacity:.08; background:#8ddbe0; }
    .glow.one { top:-20rem; right:-10rem; } .glow.two { bottom:-23rem; left:-12rem; }
    main { position:fixed; z-index:1; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; width:auto; min-width:0; padding:4rem max(1rem,calc((100vw - 720px)/2)); text-align:center; overflow:hidden; }
    .brand { display:flex; width:max-content; flex-direction:column; align-items:center; gap:.85rem; color:var(--ink); text-decoration:none; margin:0 auto 3.5rem; }
    .brand-mark { position:relative; display:block; width:5.25rem; height:5.25rem; overflow:hidden; border:1px solid rgba(141,219,224,.35); border-radius:1.35rem; background:#080a0a; box-shadow:0 0 42px rgba(141,219,224,.14); }
    .brand-mark img { position:absolute; top:50%; left:50%; display:block; width:10.9rem; height:10.9rem; max-width:none; object-fit:cover; transform:translate(-50%,-50%); }
    .brand strong { font-size:1.02rem; letter-spacing:-.02em; } .brand strong span { color:inherit; }
    .status { display:flex; width:max-content; max-width:100%; margin:auto; align-items:center; justify-content:center; gap:.55rem; padding:.5rem .85rem; border:1px solid var(--line); border-radius:999px; color:#fff; background:rgba(255,255,255,.07); font-size:.72rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase; }
    .pulse { width:.48rem; height:.48rem; border-radius:2px; background:var(--accent); transform:rotate(45deg); }
    h1 { margin:1.6rem auto 1.15rem; max-width:680px; font-size:clamp(3rem,9vw,5.8rem); line-height:1; letter-spacing:-.055em; font-weight:700; color:#fff; }
    h1 span { display:block; color:inherit; }
    .lead { width:100%; max-width:550px; margin:0 auto; color:var(--muted); font-size:clamp(1rem,2.4vw,1.15rem); line-height:1.75; }
    .notice { width:100%; max-width:470px; margin:2.4rem auto 0; padding:1rem 1.15rem; border:1px solid var(--line); border-radius:.75rem; color:rgba(255,255,255,.82); background:rgba(10,8,17,.28); font-size:.86rem; line-height:1.6; }
    footer { margin-top:3.5rem; color:rgba(255,255,255,.48); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; }
    @media (max-width:520px) { main { padding:2.5rem 1rem; } .brand { margin-bottom:3.2rem; } .status { max-width:100%; font-size:.64rem; letter-spacing:.09em; } h1 { font-size:clamp(2.5rem,13vw,3.25rem); } .lead { padding:0 .35rem; } footer { margin-top:3.5rem; font-size:.62rem; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; } }
  </style>
